# Project-owned root analyzer config (see .standards/skills/flutter/SKILL.md,
# Exceptions). The house standard is included unchanged from the vendored
# release; this file only adds project rules. Frozen Dart files, if any are
# ever added to .standards-exclude, must also be listed under analyzer.exclude
# here (the lists merge with the included file).
include: .standards/skills/flutter/analysis_options.yaml

linter:
  rules:
    # Project additions (stricter than the house standard).
    prefer_final_locals: true
    sort_child_properties_last: true
