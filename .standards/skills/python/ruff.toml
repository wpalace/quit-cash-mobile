# Managed by coding-standards (scripts/sync-standards.sh). Do not edit in projects; change it upstream.
# Python standard: ruff format + ruff check, line length 100.
line-length = 100
# No target-version on purpose: Ruff infers it from requires-python in pyproject.toml, so the
# lint target always matches the project's declared floor (3.14 by default, 3.12+ allowed).
extend-exclude = [".standards"] # vendored standards are checked upstream

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false # trailing comma keeps one item per line
docstring-code-format = true

[lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort: stdlib, third-party, local
  "B",   # bugbear: mutable defaults (B006), finally control flow (B012)
  "UP",  # pyupgrade: modern syntax for the target version
  "SIM", # simplify
  "N",   # pep8-naming
]

[lint.isort]
combine-as-imports = true
